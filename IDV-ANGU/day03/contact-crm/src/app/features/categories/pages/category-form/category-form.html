<section class="form-container">
  <h1>{{ categoryId ? 'Edit Category' : 'Create Category' }}</h1>

  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Category name *</label>
      <input id="name" type="text" formControlName="name" />

      @if (categoryForm.controls.name.touched && categoryForm.controls.name.invalid) {
        <small>Category name is required.</small>
      }
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        rows="4"
        formControlName="description"
      ></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="categoryForm.invalid">
        {{ categoryId ? 'Save changes' : 'Create category' }}
      </button>

      <a routerLink="/categories">Cancel</a>
    </div>
  </form>
</section>
